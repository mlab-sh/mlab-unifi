name: Release

# Build mlab-unifi for macOS and Linux, then publish everything on the GitHub
# release: tarballs for every target, a .deb and an .rpm for Linux, and a
# Homebrew formula in this repo pointing at those assets.
#
# Manual trigger. The version is whatever Cargo.toml says, so a release is a
# version bump, a commit, and a click.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all --locked

  version:
    name: Resolve version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: v
        run: |
          VERSION=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Pinned to 22.04 on purpose: a glibc binary never runs against a
          # glibc older than the one it was linked with, and ubuntu-latest
          # (24.04, glibc 2.39) produces binaries that refuse to start on
          # Debian 12 and Ubuntu 22.04. 22.04 lowers the floor to glibc 2.35.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      # ring compiles C, so the ARM64 cross build needs a cross compiler and an
      # archiver, not just a linker.
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          NAME="mlab-unifi-${VERSION}-${TARGET}"
          STAGE="$(mktemp -d)/${NAME}"
          mkdir -p "$STAGE"

          cp "target/${TARGET}/release/mlab-unifi" "$STAGE/"
          cp LICENSE README.md "$STAGE/"

          FILE="${NAME}.tar.gz"
          tar -czf "$FILE" -C "$(dirname "$STAGE")" "$NAME"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.file }}

      # .deb and .rpm are built only for the glibc Linux targets: neither format
      # means anything on macOS.
      #
      # --no-strip because the release profile already strips; letting cargo-deb
      # strip again would run the host strip against the aarch64 binary and fail
      # the cross build.
      - name: Build .deb
        id: deb
        if: contains(matrix.target, 'linux-gnu')
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          case "${{ matrix.target }}" in
            x86_64-*)  DEB_ARCH=amd64 ;;
            aarch64-*) DEB_ARCH=arm64 ;;
          esac
          cargo install cargo-deb --locked
          FILE="mlab-unifi_${VERSION}_${DEB_ARCH}.deb"
          cargo deb --no-build --no-strip \
            --target "${{ matrix.target }}" \
            --deb-version "$VERSION" \
            --output "$FILE"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"
          echo "artifact=mlab-unifi-deb-${DEB_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Upload .deb
        if: contains(matrix.target, 'linux-gnu')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.deb.outputs.artifact }}
          path: ${{ steps.deb.outputs.file }}

      # The binary is staged at pkg/ because the rpm asset paths in Cargo.toml
      # are taken literally: pointing them at target/release would package the
      # host build, which on a cross run is the wrong architecture entirely.
      # gzip rather than the zstd default so rpm 4.14 (RHEL 8 and its rebuilds)
      # can still read the payload.
      - name: Build .rpm
        id: rpm
        if: contains(matrix.target, 'linux-gnu')
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          case "${{ matrix.target }}" in
            x86_64-*)  RPM_ARCH=x86_64 ;;
            aarch64-*) RPM_ARCH=aarch64 ;;
          esac
          mkdir -p pkg
          cp "target/${{ matrix.target }}/release/mlab-unifi" pkg/mlab-unifi
          cargo install cargo-generate-rpm --locked
          FILE="mlab-unifi-${VERSION}-1.${RPM_ARCH}.rpm"
          cargo generate-rpm \
            --target "${{ matrix.target }}" \
            --payload-compress gzip \
            --output "$FILE"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"
          echo "artifact=mlab-unifi-rpm-${RPM_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Upload .rpm
        if: contains(matrix.target, 'linux-gnu')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rpm.outputs.artifact }}
          path: ${{ steps.rpm.outputs.file }}

  release:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Compute sha256 hashes
        id: hashes
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            FILE="dist/mlab-unifi-${VERSION}-${target}.tar.gz"
            HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
            key=$(echo "$target" | tr '[:lower:]-' '[:upper:]_')
            echo "${key}=${HASH}" >> "$GITHUB_OUTPUT"
            echo "  ${target}: ${HASH}"
          done

      - name: Generate Formula/mlab-unifi.rb
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p Formula
          cat > Formula/mlab-unifi.rb <<EOF
          class MlabUnifi < Formula
            desc "CLI over the UniFi APIs, for passive network security work"
            homepage "https://github.com/mlab-sh/mlab-unifi"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/mlab-sh/mlab-unifi/releases/download/v#{version}/mlab-unifi-#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.hashes.outputs.AARCH64_APPLE_DARWIN }}"
              else
                url "https://github.com/mlab-sh/mlab-unifi/releases/download/v#{version}/mlab-unifi-#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.hashes.outputs.X86_64_APPLE_DARWIN }}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/mlab-sh/mlab-unifi/releases/download/v#{version}/mlab-unifi-#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.hashes.outputs.X86_64_UNKNOWN_LINUX_GNU }}"
              elsif Hardware::CPU.arm?
                url "https://github.com/mlab-sh/mlab-unifi/releases/download/v#{version}/mlab-unifi-#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.hashes.outputs.AARCH64_UNKNOWN_LINUX_GNU }}"
              end
            end

            def install
              bin.install "mlab-unifi"
            end

            test do
              assert_match "mlab-unifi", shell_output("#{bin}/mlab-unifi --version")
            end
          end
          EOF
          sed -i 's/^          //' Formula/mlab-unifi.rb
          cat Formula/mlab-unifi.rb

      # The formula is generated from the checksums just computed, so it is
      # committed back rather than hand-edited.
      - name: Commit the Homebrew formula
        run: |
          git add Formula/mlab-unifi.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, skipping commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: bump the Homebrew formula to v${{ needs.version.outputs.version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Nothing signs these assets, so the release carries the checksums of
      # everything in it: the only way a manual download can be checked.
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          (cd dist && sha256sum mlab-unifi-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
